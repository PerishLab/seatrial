[workspace]
resolver = "3"
members = ["crates/cli", "crates/lib"]
default-members = ["crates/cli", "crates/lib"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/PerishLab/seatrial"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
getrandom = "0.3"
plumb = { version = "0", registry = "perish" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time", "signal", "sync"] }
toml = "0.9"
libc = "0.2"
tempfile = "3"
