[package]
name = "seatrial"
description = "Black-box sea trials of PerishLab executables."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "seatrial"

[dependencies]
clap.workspace = true
plumb.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tempfile.workspace = true
seatrial-lib = { path = "../lib" }


[[bin]]
name = "seatrial"
path = "src/main.rs"

[[bin]]
name = "seatrial-keel"
path = "../../scenes/keel/src/main.rs"

[[bin]]
name = "seatrial-dynet"
path = "../../scenes/dynet/dns.rs"
