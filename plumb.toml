
[layout]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "The CLI and scene-independent library."

[[layout.seat]]
path = ".runseal"
note = "Committed inert Runseal resources."

[[layout.file]]
name = ["README.md"]
note = "Public introduction."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "Rust workspace anchors."

[[layout.file]]
name = ["seatrial.toml"]
note = "What a run trials: first-party products by channel, third-party images by exact tag."

[[layout.seat]]
path = ".cargo"
note = "Cargo registry configuration."

[[layout.seat]]
path = "scenes/*"
scan = ["scenes/*/**/*.rs", "scenes/*/**/*.py"]
note = "Product-owned black-box scene manifests, programs and Rust drivers."

[identity]
ns = "seatrial"

[release]
authority = "https://releases.seatrial.perish.uk"
binaries = ["seatrial"]
targets = ["x86_64-unknown-linux-gnu"]
